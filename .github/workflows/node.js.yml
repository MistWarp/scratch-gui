name: Build and Deploy

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

# Keyed by ref so a merge into develop cannot cancel an unrelated pull
# request's checks. Runs for the same ref still supersede each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm run deps:check
    - run: pnpm run i18n:community:check
    - run: pnpm run i18n:editor:check
    - run: pnpm run test:unit:ci
    - run: pnpm run build
      env:
        NODE_ENV: production
        ROUTING_STYLE: hash
        MW_BUILD_ID: ${{ github.sha }}
        MW_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        GITHUB_RUN_ID: ${{ github.run_id }}
    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./build/

  deploy:
    # Pull requests build and test, but only develop publishes. The ref check
    # also covers workflow_dispatch, which would otherwise let a manual run on
    # any branch deploy that branch to production.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
