name: Build

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

# Keyed by ref so a merge into develop cannot cancel an unrelated pull
# request's checks. Runs for the same ref still supersede each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm run deps:check
    - run: pnpm lint
    - run: pnpm run i18n:community:check
    - run: pnpm run i18n:editor:check
    - run: pnpm run test:unit:ci
    - run: pnpm run build
      env:
        NODE_ENV: production
        MW_COMMUNITY: 'true'
        NODE_OPTIONS: --max-old-space-size=7168
    - run: node scripts/validate-deploy.mjs build
