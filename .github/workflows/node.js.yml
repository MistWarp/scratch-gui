name: Build

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

# Keyed by ref so a merge into develop cannot cancel an unrelated pull
# request's checks. Runs for the same ref still supersede each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Only `pnpm run test:integration` needs chromedriver, and no job here runs it.
  CHROMEDRIVER_SKIP_DOWNLOAD: 'true'

# The three jobs run in parallel. Together they run what `pnpm run check:full` runs locally.
jobs:
  static:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    # Nothing here runs dependency build scripts.
    - run: pnpm install --frozen-lockfile --ignore-scripts
    - run: pnpm run lint
    - run: pnpm run i18n:editor:check
    - run: pnpm run i18n:community:check
    - run: pnpm run check:community-css
    - run: pnpm run deps:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm run test:unit:ci --reporters=default --reporters=github-actions

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    # Cloudflare Pages also installs without build scripts (scripts/cloudflare-build.mjs).
    - run: pnpm install --frozen-lockfile --ignore-scripts
    # The community site build, as deployed. build:deploy raises Node's heap limit itself.
    - run: pnpm run build:deploy
      env:
        NODE_ENV: production
    - run: pnpm run validate-deploy
    - uses: actions/upload-artifact@v4
      with:
        name: build
        path: build/
        retention-days: 7
